<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartOrder · Menu</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/menu.css" />
  </head>
  <body>
    <header>
      <h1>SmartOrder</h1>
      <p>
        <a href="/menu">Menu</a>
                ·
        <a href="/order">Customer view</a>
        ·
        <a href="/">Profile &amp; accounts</a>
        <span id="who"></span>
      </p>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section>
        <h2>Menu</h2>
        <div class="tools">
          <input id="search" type="search" placeholder="Search dishes" aria-label="Search menu" />
          <select id="categoryFilter" aria-label="Category"></select>
        </div>
        <div id="menuState" class="state hidden"></div>
        <div id="menuGrid" class="menu-grid"></div>
        <p id="cartBar" class="cart hidden">
          <span id="cartText"></span>
          <button id="checkout">Check out</button>
          <button id="clearCart" class="secondary">Clear</button>
        </p>
      </section>
      <section id="manage" class="hidden">
        <h2>Manage menu</h2>
        <p class="muted">Owners can add, edit, deactivate, and remove menu items.</p>
        <button id="newItem">Add item</button>
        <div id="manageList"></div>
      </section>
    </main>
    <dialog id="detail"></dialog>
    <dialog id="editor">
      <form id="itemForm" novalidate>
        <h2 id="editorTitle">Add item</h2>
        <label>
          Name
          <input name="name" required minlength="2" maxlength="80" />
        </label>
        <label>
          Category
          <input name="category" required minlength="2" maxlength="40" />
        </label>
        <label>
          Price (USD)
          <input name="price" type="number" step="0.01" min="0.01" max="999.99" required />
        </label>
        <label>
          Description
          <input name="description" maxlength="300" />
        </label>
        <label>
          Image link (https, optional)
          <input name="imageUrl" type="url" maxlength="500" />
        </label>
        <p id="formError" class="error" role="alert"></p>
        <div class="row">
          <button type="button" id="cancelEdit" class="secondary">Cancel</button>
          <button>Save item</button>
        </div>
      </form>
    </dialog>
    <script src="/menu.js" defer></script>
  </body>
</html>
